<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Mantenimiento</title>
    <link rel="stylesheet" href="/static/principalvista.css">
    <link rel="icon" href="/static/iconom.ico" type="image/x-icon">
</head>
<body>
    <div class="background-container">
        <!-- Barra de Navegación / Cabecera -->
        <header class="button-frame">
            <nav class="nav-container">
                <button class="btn-main" onclick="navegarA('/ot')">Órdenes de Trabajo</button>
                <button class="btn-main" onclick="navegarA('/tareas')">Tareas Fin de Semana</button>
                <button class="btn-main" onclick="navegarA('/partediario')">Parte Diario</button>
                <button class="btn-main" onclick="navegarA('/notapedido')">Notas de Pedido</button>

                <!-- Menú desplegable de Parámetros -->
                <div class="dropdown">
                    <button class="btn-main dropdown-toggle">Parámetros ▼</button>
                    <div class="dropdown-menu">
                        <a href="#" onclick="navegarA('/mecanicos')">Mecánicos</a>
                        <a href="#" onclick="navegarA('/sectores')">Sectores</a>
                        <a href="#" onclick="navegarA('/plantas')">Plantas</a>
                    </div>
                </div>

                <button class="btn-main btn-salir" onclick="cerrarSesion()">Salir</button>
            </nav>
        </header>

        <!-- Contenido dinámico / Pantalla principal -->
        <main class="main-content">
            <div class="welcome-card">
                <h1>Sistema de Gestión de Mantenimiento</h1>
                <p>Seleccione un módulo en el menú superior para comenzar.</p>
            </div>
        </main>
    </div>

    <script>
        // Lógica de inactividad (10 minutos = 600,000 ms)
        const TIEMPO_LIMITE_MS = 10 * 60 * 1000;
        let idTimer = null;

        function resetTimer() {
            if (idTimer) clearTimeout(idTimer);
            idTimer = setTimeout(cerrarSesionInactividad, TIEMPO_LIMITE_MS);
        }

        function cerrarSesionInactividad() {
            alert("Sesión cerrada automáticamente por inactividad (10 minutos).");
            window.location.href = "/logout";
        }

        function cerrarSesion() {
            if (confirm("¿Desea cerrar la sesión del sistema?")) {
                window.location.href = "/logout";
            }
        }

        function navegarA(ruta) {
            resetTimer();
            window.location.href = ruta;
        }

        // Detectar actividad en la pantalla
        window.onload = resetTimer;
        document.onmousemove = resetTimer;
        document.onkeypress = resetTimer;
        document.onclick = resetTimer;
        document.onscroll = resetTimer;
    </script>
</body>
</html>
